name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime
        run: node --version
      - name: Selection and project inspection
        run: |
          node skills/agentic-ui-ux/scripts/test-plan.mjs
          node skills/agentic-ui-ux/scripts/test-inspect.mjs
      - name: CLI and package integrity
        run: node skills/agentic-ui-ux/scripts/test-cli.mjs
