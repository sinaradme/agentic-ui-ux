name: Repository quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runtime
        run: node --version
      - name: Selection and project inspection
        run: |
          node skills/agentic-ui-ux/scripts/test-plan.mjs
          node skills/agentic-ui-ux/scripts/test-inspect.mjs
          node skills/agentic-ui-ux/scripts/test-route.mjs
          node skills/agentic-ui-ux/scripts/test-grounding.mjs
          node skills/agentic-ui-ux/scripts/generate-index.mjs --check
          node skills/agentic-ui-ux/scripts/test-repository.mjs
      - name: CLI and package integrity
        run: node skills/agentic-ui-ux/scripts/test-cli.mjs
