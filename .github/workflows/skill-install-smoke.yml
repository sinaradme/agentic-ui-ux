name: Skill install smoke
on:
  push:
    branches: [main]
    paths:
      - 'skills/agentic-ui-ux/**'
      - '.github/workflows/skill-install-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned skills CLI in disposable runner directory
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          mkdir -p "$RUNNER_TEMP/skills-cli"
          npm install --prefix "$RUNNER_TEMP/skills-cli" --no-save --ignore-scripts --no-audit --no-fund skills@1.9.1
          node "$RUNNER_TEMP/skills-cli/node_modules/skills/bin/cli.mjs" --version
      - name: Install only this repository's skill into three isolated projects
        shell: bash
        env:
          CI: 'true'
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/skills-cli/node_modules/skills/bin/cli.mjs"
          for agent in cursor codex claude-code; do
            target="$(mktemp -d "$RUNNER_TEMP/agentic-smoke-$agent-XXXXXX")"
            mkdir -p "$target/home"
            cd "$target"
            git init -q
            printf '%s\n' '{"name":"agentic-smoke","private":true,"dependencies":{"next":"16"}}' > package.json
            before="$(sha256sum package.json)"
            HOME="$target/home" node "$cli" add "$GITHUB_WORKSPACE" --skill agentic-ui-ux --agent "$agent" --copy --yes
            case "$agent" in
              claude-code) skill="$target/.claude/skills/agentic-ui-ux" ;;
              *) skill="$target/.agents/skills/agentic-ui-ux" ;;
            esac
            test -f "$skill/SKILL.md"
            test -f "$skill/references/catalog.json"
            test -f "$skill/references/acceptance.md"
            test -f "$skill/scripts/inspect.mjs"
            node "$skill/scripts/test-plan.mjs"
            node "$skill/scripts/test-route.mjs"
            node "$skill/scripts/test-grounding.mjs"
            node "$skill/scripts/test-source.mjs"
            node "$skill/scripts/test-connect.mjs"
            node "$skill/scripts/test-rebuild.mjs"
            node "$skill/scripts/test-rebuild-artifacts.mjs"
            node "$skill/scripts/generate-index.mjs" --check
            node "$skill/scripts/test-cli.mjs"
            test "$before" = "$(sha256sum package.json)"
            echo "PASS: $agent project-scoped skill files, executable planner and unchanged app manifest"
          done
      - name: Verify the public GitHub install route
        shell: bash
        env:
          CI: 'true'
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          set -euo pipefail
          target="$(mktemp -d "$RUNNER_TEMP/agentic-remote-XXXXXX")"
          mkdir -p "$target/home"
          cd "$target"
          git init -q
          printf '%s\n' '{"name":"agentic-remote","private":true}' > package.json
          before="$(sha256sum package.json)"
          HOME="$target/home" node "$RUNNER_TEMP/skills-cli/node_modules/skills/bin/cli.mjs" add sinaradme/agentic-ui-ux --skill agentic-ui-ux --agent codex --copy --yes
          skill="$target/.agents/skills/agentic-ui-ux"
          test -f "$skill/SKILL.md"
          test -f "$skill/LICENSE"
          test -f "$skill/references/catalog.json"
          node "$skill/scripts/test-route.mjs"
            node "$skill/scripts/test-grounding.mjs"
            node "$skill/scripts/test-source.mjs"
            node "$skill/scripts/test-connect.mjs"
            node "$skill/scripts/test-rebuild.mjs"
            node "$skill/scripts/test-rebuild-artifacts.mjs"
            node "$skill/scripts/generate-index.mjs" --check
          node "$skill/scripts/test-cli.mjs"
          test "$before" = "$(sha256sum package.json)"
          node "$skill/scripts/source.mjs" read replacement-world > "$target/source-receipt.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.id!=="replacement-world"||!r.content||!r.sha256)process.exit(1);console.log("PASS installed skill live upstream retrieval",r.id,r.bytes)' "$target/source-receipt.json"
          printf '%s\n' '{"agent":"codex","stack":"react-web","goal":"motion","primary":"none"}' > "$target/connect-task.json"
          node "$skill/scripts/connect.mjs" "$target/connect-task.json" "$target" --apply > "$target/connect-receipt.json"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.status!=="original-files-verified"||!r.results.some(x=>x.name==="animate"&&x.verifiedFiles>0))process.exit(1);console.log("PASS installed central skill installed original upstream animate")' "$target/connect-receipt.json"
          test "$before" = "$(sha256sum package.json)"
          echo "PASS: public GitHub install route and working installed CLI"
